[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videoforge"
version = "0.1.0"
description = "Editor de video automatico con analisis local: entiende el video, lo monta y mide que no quede sobresaturado."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "numpy<3",
    "opencv-python-headless>=4.9",
    "scenedetect>=0.6",
    "imageio-ffmpeg>=0.5",
    # Raices de palabra en castellano. Puro Python y unos pocos KB: es lo que
    # permite que los campos de significado se escriban con palabras normales
    # ("descargar") y reconozcan todas sus formas.
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1"]
audio = ["librosa>=0.10"]
vision = ["onnxruntime>=1.18"]
vision-gpu = ["onnxruntime-gpu>=1.18"]
ocr = ["pytesseract>=0.3"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
