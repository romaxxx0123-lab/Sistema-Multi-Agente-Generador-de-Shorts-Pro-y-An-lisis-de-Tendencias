[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videoforge"
version = "0.1.0"
description = "Editor de video automatico con analisis local: entiende el video, lo monta y mide que no quede sobresaturado."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "numpy<3",
    "opencv-python-headless>=4.9",
    "scenedetect>=0.6",
    "imageio-ffmpeg>=0.5",
    # Raices de palabra en castellano. Puro Python y unos pocos KB: es lo que
    # permite que los campos de significado se escriban con palabras normales
    # ("descargar") y reconozcan todas sus formas.
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1"]
audio = ["librosa>=0.10"]
vision = ["onnxruntime>=1.18"]
vision-gpu = ["onnxruntime-gpu>=1.18"]
# El OCR recomendado: los modelos viajan dentro del paquete, asi que no hay
# nada que descargar despues ni ningun programa del sistema que instalar.
ocr = ["rapidocr-onnxruntime>=1.4"]
# El otro motor es el binario `tesseract` del sistema, y no hay nada que
# instalar con pip: el codigo lo llama por linea de comandos. Este extra existia
# con `pytesseract` dentro, que el proyecto no importa en ningun sitio, asi que
# instalarlo no daba OCR a nadie. Se deja vacio y documentado.
ocr-tesseract = []
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-timeout>=2"]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
