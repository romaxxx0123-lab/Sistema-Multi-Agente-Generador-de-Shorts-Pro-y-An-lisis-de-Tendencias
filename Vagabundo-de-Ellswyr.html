<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vagabundo de Ellswyr — explorador pixel art</title>
<style>
  :root{
    --ink:#0c0e14; --panel:rgba(16,18,26,.82); --gold:#d8b45c; --parch:#e8dcc0;
    --edge:#6b5a3a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0c12}
  body{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color:var(--parch); -webkit-font-smoothing:none;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  canvas#game{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  .hidden{display:none!important}

  #loading{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;z-index:40;
    background:#0a0c12;
  }
  #loading .bar{width:200px;height:8px;background:#1b2030;border:2px solid #414b63;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:40%;background:#d8b45c;
    animation:sl 1.1s infinite ease-in-out}
  @keyframes sl{0%{margin-left:-40%}100%{margin-left:100%}}
  #loading .lt{color:#8b93a8;font-size:11px;letter-spacing:.3em;text-transform:uppercase}

  /* ---------- touch ---------- */
  #touch{position:fixed;inset:0;z-index:25;pointer-events:none}
  #stick{
    position:absolute;left:22px;bottom:22px;width:104px;height:104px;
    border-radius:50%;background:rgba(20,24,34,.42);border:2px solid rgba(107,90,58,.7);
    pointer-events:auto;
  }
  #nub{
    position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;
    border-radius:50%;background:rgba(216,180,92,.42);border:2px solid rgba(216,180,92,.8);
  }
  .tbtn{
    position:absolute;right:22px;width:70px;height:70px;border-radius:50%;
    background:rgba(20,24,34,.5);border:2px solid rgba(107,90,58,.8);
    color:#f0e6cc;font:inherit;font-size:12px;pointer-events:auto;
  }
  #btnAct{bottom:34px}
  #btnMap{bottom:118px;width:56px;height:56px;right:29px;font-size:11px}
  @media (hover:hover) and (pointer:fine){ #touch{display:none} }
  @media (max-width:720px){ #keys{display:none} #inv .it{font-size:11px;padding:4px 8px} }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="loading">
  <div class="bar"><i></i></div>
  <div class="lt">forjando el mundo</div>
</div>

<div id="touch">
  <div id="stick"><div id="nub"></div></div>
  <button class="tbtn" id="btnAct">E</button>
  <button class="tbtn" id="btnMap">MAP</button>
</div>

<div id="pause" class="hidden">
  <h3>PAUSA</h3>
  <button class="mb" id="btnResume">Continuar</button>
  <button class="mb" id="btnQuit">Volver al título</button>
</div>

// ---------------------------------------------------------------- noise
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class Perlin {
  constructor(seed) {
    const rnd = mulberry32(seed);
    this.p = new Uint8Array(512);
    const perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) {
      const j = (rnd() * (i + 1)) | 0;
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }
    for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
  }
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  grad(h, x, y) {
    switch (h & 3) {
      case 0: return x + y; case 1: return -x + y;
      case 2: return x - y; default: return -x - y;
    }
  }
  at(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = this.fade(xf), v = this.fade(yf);
    const p = this.p;
    const aa = p[p[X] + Y], ab = p[p[X] + Y + 1];
    const ba = p[p[X + 1] + Y], bb = p[p[X + 1] + Y + 1];
    const x1 = lerp(this.grad(aa, xf, yf), this.grad(ba, xf - 1, yf), u);
    const x2 = lerp(this.grad(ab, xf, yf - 1), this.grad(bb, xf - 1, yf - 1), u);
    return lerp(x1, x2, v); // ~[-1,1]
  }
  fbm(x, y, oct = 4, lac = 2, gain = 0.5) {
    let a = 1, f = 1, s = 0, n = 0;
    for (let i = 0; i < oct; i++) { s += a * this.at(x * f, y * f); n += a; a *= gain; f *= lac; }
    return s / n;
  }
}
const lerp = (a, b, t) => a + (b - a) * t;

  8: { name: 'Montaña', tile: 'rock' },
  9: { name: 'Tundra', tile: 'snow' },
  10: { name: 'Yermo Ceniciento', tile: 'ash' },
};
// draw priority for transition blending (higher paints over lower)
const TILE_PRIO = {
  deep: 0, water: 1, swamp: 2, sand: 3, grass: 4, meadow: 5,
  forest: 6, dirt: 7, ash: 8, rock: 9, snow: 10,
};

// Decoración pura: sprites que ya eran type 'deco' (no se recolectan, no entran
// en el guardado). Sólo biomas con vegetación — la roca, la nieve, el desierto y
// el yermo tienen que seguir sintiéndose pelados.
const TSIZE = [['_s', 4], ['', 5], ['', 5], ['_l', 7]];

// Árboles por bioma y densidad OBJETIVO por tile (no la probabilidad cruda del
// sorteo: `treeSpot` compensa internamente el filtro de separación).
const TREES = {
  [BIOME.FOREST]: { d: 0.075, s: ['tree_oak_0', 'tree_oak_1', 'tree_pine_3', 'tree_pine_4', 'tree_jungle_5'] },
  [BIOME.GRASS]: { d: 0.026, s: ['tree_oak_0', 'tree_autumn_2', 'tree_oak_1'] },
  [BIOME.MEADOW]: { d: 0.013, s: ['tree_cherry_7', 'tree_oak_0'] },
  [BIOME.SWAMP]: { d: 0.042, s: ['tree_dead_6', 'tree_jungle_5'] },
  [BIOME.SNOW]: { d: 0.038, s: ['tree_pine_3', 'tree_pine_4'] },
  [BIOME.ASH]: { d: 0.030, s: ['tree_dead_6'] },
};

// Hash espacial estable, independiente del chunk que se esté generando.
function h01(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = Math.imul(h ^ (h >> 13), 1274126177);
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}

const DECO = {
  [BIOME.MEADOW]: ['tuft_0', 'tuft_1', 'tuft_2'],
  [BIOME.GRASS]: ['tuft_0', 'tuft_1', 'tuft_2'],
  [BIOME.FOREST]: ['tuft_0', 'tuft_1', 'tuft_2'],
  [BIOME.SWAMP]: ['tuft_0', 'tuft_2', 'cattail_0'],
};

// ---------------------------------------------------------------- generación
// Estos números NO salieron de tantear a ojo: son el resultado de optimizar el
// reparto de biomas contra un objetivo por descenso por coordenadas. Tocar uno
// suelto desbalancea el resto; conviene re-medir después de cambiarlos.
const GEN = {
  contW: 0.60,    // peso del campo continental frente al de detalle
  contK: 1.80,    // contraste del continental: más alto = costas más marcadas
  ridgePow: 9,    // agudeza de la cresta: más alto = cordillera más fina
  ridgeAmp: 0.14, // cuánto levanta la cresta
  bias: 0.01,
  mK: 2.00,       // ensanche de la humedad
  tK: 3.10,       // ensanche de la temperatura
  hDeep: 0.315,  // 0.30 dejaba el océano en 3.8%; con esto queda en 5.2%
  hMount: 0.67, hHigh: 0.83,
  tSnow: 0.25, tSnowHi: 0.30,
  tDesert: 0.66, mDesert: 0.38,
  tAsh: 0.74, mAsh: 0.48,
  mSwamp: 0.67, mForest: 0.55, mGrass: 0.41,
};

const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);

// El fbm se apiña alrededor de 0.5: medido, su p5 era 0.34 y su p95 0.66. Los
// umbrales estaban escritos como si el campo fuese uniforme en [0,1], asi que
// "m < 0.34" caia justo en el percentil 5 y "t > 0.80" directamente fuera del
// rango. Por eso el Yermo Ceniciento no existia y el Desierto era el 0.08% del
// mundo. Esto estira la campana para que los extremos tengan masa de verdad.
const spread = (v, k) => clamp01(0.5 + (v - 0.5) * k);
const CH = 24; // chunk size in tiles
const TS_PX = 16;
class World {
  constructor(seed, cfg) {
    this.seed = seed >>> 0;
    cfg = cfg || {};
    // world size -> how quickly land gives way to ocean
    this.landBias = [-0.045, 0, 0.055][cfg.size === undefined ? 1 : cfg.size];
    // vegetation density multiplier
    this.densMul = [0.55, 1, 1.65][cfg.density === undefined ? 1 : cfg.density];
    this.hN = new Perlin(this.seed);
    this.mN = new Perlin(this.seed + 1013);
    this.tN = new Perlin(this.seed + 7717);
    this.dN = new Perlin(this.seed + 3331);
    this.rN = new Perlin(this.seed + 5153);
    this.gN = new Perlin(this.seed + 8821);   // arboledas y claros
    this.chunks = new Map();
    this.dug = new Map();  // tile overrides (paths worn by the player)
    // --- player-caused deltas, the only world state worth persisting ---
    this.consumed = new Set();   // stable ids of harvested/opened props
    this.placed = [];            // props the player built
  }

  height(x, y) {
    const d = this.hN.fbm(x * 0.012, y * 0.012, 5) * 0.5 + 0.5;   // detalle
    const c = this.hN.fbm(x * 0.0022 + 100, y * 0.0022 - 40, 2) * 0.5 + 0.5;
    // El campo continental manda sobre el de detalle: es lo que produce costas
    // y masas de tierra en vez de manchas sueltas repartidas por todos lados.
    let h = spread(c, GEN.contK) * GEN.contW + d * (1 - GEN.contW)
      + GEN.bias + this.landBias;
    // Crestas. Antes: `pow(1 - |fbm|, 3) * 0.22`. Con el rango real del fbm eso
    // sumaba +0.14 de MEDIA en TODO el mapa (mediana 0.142, mínimo 0.008): no
    // dibujaba cordilleras, levantaba el mundo entero. Se comia el océano —de
    // 3.4% a 0.1% de tiles bajo el nivel del agua— e inflaba la montaña al 42%.
    // Normalizado y con exponente alto queda ~0 salvo en la línea de cresta, y
    // sólo levanta donde ya hay tierra alta, asi que las cordilleras salen
    // sobre los continentes y no en medio del mar.
    const rn = this.rN.fbm(x * 0.006, y * 0.006, 3) * 2.6;
    const r = Math.max(0, 1 - Math.abs(rn));
    h += Math.pow(r, GEN.ridgePow) * GEN.ridgeAmp * clamp01((h - 0.46) * 2.6);
    return h;
  }
  moisture(x, y) {
    return spread(this.mN.fbm(x * 0.008, y * 0.008, 4) * 0.5 + 0.5, GEN.mK);
  }
  temp(x, y) {
    const t = spread(this.tN.fbm(x * 0.004 + 55, y * 0.004, 3) * 0.5 + 0.5, GEN.tK);
    return t * 0.7 + (0.5 + 0.5 * Math.sin(y * 0.0016)) * 0.3;  // latitude bands
  }

  biomeAt(x, y) {
    const h = this.height(x, y);
    if (h < GEN.hDeep) return BIOME.DEEP;
    if (h < 0.375) return BIOME.WATER;
    if (h < 0.408) {
      // sand only where it actually meets water, otherwise fall through to land
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2;
        const sx = x + Math.round(Math.cos(a) * 3), sy = y + Math.round(Math.sin(a) * 3);
        if (this.height(sx, sy) < 0.375) return BIOME.BEACH;
      }
    }
    const m = this.moisture(x, y), t = this.temp(x, y);
    if (h > GEN.hHigh) return t < GEN.tSnowHi ? BIOME.SNOW : BIOME.ROCK;
    if (h > GEN.hMount) {
      return t < GEN.tSnowHi - 0.04 ? BIOME.SNOW
        : (t > GEN.tAsh && m < GEN.mAsh ? BIOME.ASH : BIOME.ROCK);
    }
    if (t < GEN.tSnow) return BIOME.SNOW;
    if (t > GEN.tDesert && m < GEN.mDesert) return BIOME.DESERT;
    if (m > GEN.mSwamp && h < 0.47) return BIOME.SWAMP;
    if (m > GEN.mForest) return BIOME.FOREST;
    if (m > GEN.mGrass) return BIOME.GRASS;
    return BIOME.MEADOW;
  }

  tileName(x, y) {
    const k = x + ',' + y;
    if (this.dug.has(k)) return this.dug.get(k);
    return BIOME_INFO[this.biomeAt(x, y)].tile;
  }
  level(x, y) {
    const h = this.height(x, y);
    if (h < 0.408) return 0;
    return 1 + Math.min(4, Math.floor((h - 0.408) / 0.085));
  }

  isWater(x, y) {
    const b = this.biomeAt(x, y);
    return b === BIOME.DEEP || b === BIOME.WATER;
  }

  /** Mark a prop as harvested/opened and remember it for the save. */
  consume(p) {
    if (p.id) this.consumed.add(p.id);
  }

  /** Add a player-built prop and register it in the right chunk. */
  place(p) {
    if (!p.id) p.id = 'placed:' + this.placed.length + ':' + Math.round(p.x) + ':' + Math.round(p.y);
    this.placed.push(p);
    const cx = Math.floor(p.x / (CH * TS_PX));
    const cy = Math.floor(p.y / (CH * TS_PX));
    const key = cx + ',' + cy;
    const c = this.chunks.get(key);
    if (c) { c.props.push(p); c.props.sort((a, b) => a.y - b.y); }
    return p;
  }

  /** Restore deltas from a save before any chunk is built. */
  restore(consumed, placed) {
    this.consumed = new Set(consumed || []);
    this.placed = (placed || []).map(q => Object.assign({}, q));
    this.chunks.clear();
  }

  // ---------------------------------------------------------- chunks
  chunk(cx, cy) {
    const key = cx + ',' + cy;
    let c = this.chunks.get(key);
    if (!c) { c = this.buildChunk(cx, cy); this.chunks.set(key, c); }
    return c;
  }

  /** ¿Va un árbol en este tile?
   *
   *  Antes era un sorteo por tile: en bosque, `r < 0.26`. Eso da una alfombra
   *  uniforme de ~61 árboles en pantalla, sin claros y con la holgura mediana
   *  en un solo tile: técnicamente se camina, pero se pasa el rato esquivando.
   *  Dos reglas lo arreglan, las dos deterministas y sin depender del orden de
   *  generación ni de los límites de chunk (dentro de `buildChunk` sólo se ven
   *  los props del chunk actual, asi que consultar vecinos no era opción):
   *
   *  1. SEPARACIÓN. Un tile sólo lleva árbol si su hash es el mayor de su
   *     vecindad 3x3. Asi no hay dos troncos pegados y desaparecen los pasillos
   *     imposibles. Como efecto lateral pone un techo de 1/9 a la densidad.
   *  2. CLAROS. La densidad la modula un ruido de baja frecuencia: el bosque
   *     alterna arboledas cerradas con claros abiertos en vez de ser una malla
   *     pareja. Los claros son lo que hace que se pueda caminar y, de paso, lo
   *     que le da ritmo a la exploración: se ven desde lejos y dan a dónde ir.
   */
  treeSpot(wx, wy, base) {
    const v = h01(wx, wy);
    for (let j = -1; j <= 1; j++) {
      for (let i = -1; i <= 1; i++) {
        if ((i || j) && h01(wx + i, wy + j) >= v) return false;
      }
    }
    // el sorteo de densidad usa OTRO hash: `v` ya está sesgado alto por haber
    // ganado la competencia de separación
    const dens = base * this.grove(wx, wy) * this.densMul * 9;
    return h01(wx + 9173, wy - 6427) < dens;
  }

  /** Factor de arboleda/claro: ~0 en los claros, hasta ~2 en lo cerrado. */
  grove(wx, wy) {
    return Math.max(0, 0.34 + this.gN.fbm(wx * 0.021, wy * 0.021, 2) * 2.0);
  }

  buildChunk(cx, cy) {
    const rnd = mulberry32((cx * 73856093) ^ (cy * 19349663) ^ this.seed);
    const props = [];   // {x,y,sprite,solid,r,type,...}
    const spawns = [];
    for (let ty = 0; ty < CH; ty++) {
      for (let tx = 0; tx < CH; tx++) {
        const wx = cx * CH + tx, wy = cy * CH + ty;
        const b = this.biomeAt(wx, wy);
        const info = BIOME_INFO[b];
        if (info.water) continue;
        const px = wx * 16 + 2 + rnd() * 12;
        const py = wy * 16 + 2 + rnd() * 12;
        const r = rnd() / this.densMul;
        const add = (sprite, solid, rad, type, extra) =>
          props.push(Object.assign({ x: px, y: py, s: sprite, solid, r: rad, type }, extra || {}));
        // Talla del árbol, con el radio de colisión acorde. Nueve robles en
        // pantalla dejan de ser nueve calcos del mismo bitmap.
        const tree = (name) => {
          const t = pick(rnd, TSIZE);
          add(name + t[0], true, t[1], 'tree');
        };

        // Los árboles salen de la rejilla con separación, no de la cadena de
        // `r`: asi un claro puede seguir teniendo arbustos y hongos, y un tile
        // con árbol no consume el sorteo del resto.
        const gv = this.grove(wx, wy);   // <0.5 = claro, >1.2 = arboleda cerrada
        const tt = TREES[b];
        if (tt && this.treeSpot(wx, wy, tt.d)) tree(pick(rnd, tt.s));

        switch (b) {
          case BIOME.FOREST:
            if (r < 0.05) add(pick(rnd, ['bush_0', 'bush_1', 'bush_berry']), false, 0, r < 0.025 ? 'berry' : 'bush');
            else if (r < 0.066) add(pick(rnd, ['mush_red', 'mush_brown', 'mush_blue']), false, 0, 'mushroom');
            else if (r < 0.12) add(pick(rnd, ['tuft_0', 'tuft_1', 'tuft_2']), false, 0, 'deco');
            else if (r < 0.135) add('stump_0', true, 5, 'wood');
            else if (r < 0.145) add(pick(rnd, ['rock_s_0', 'rock_s_1']), false, 0, 'stone');
            // Las flores del bosque salen sólo en los claros. Un claro deja de
            // ser un hueco en el bosque y pasa a ser algo que se ve desde lejos
            // y da a dónde ir: la razón para desviarse del camino.
            else if (r < 0.21 && gv < 0.5) add(`flower_${(rnd() * 6) | 0}`, false, 0, 'flower');
            break;
          case BIOME.GRASS:
            if (r < 0.02) add(pick(rnd, ['bush_0', 'bush_berry']), false, 0, r < 0.013 ? 'berry' : 'bush');
            else if (r < 0.105) add(pick(rnd, ['tuft_0', 'tuft_1', 'tuft_2']), false, 0, 'deco');
            else if (r < 0.12) add(pick(rnd, ['rock_s_0', 'rock_s_1', 'rock_s_2']), false, 0, 'stone');
            else if (r < 0.125) add('rock_b_0', true, 6, 'stone');
            break;
          case BIOME.MEADOW:
            if (r < 0.11) add(`flower_${(rnd() * 6) | 0}`, false, 0, 'flower');
            else if (r < 0.19) add(pick(rnd, ['tuft_0', 'tuft_1', 'tuft_2']), false, 0, 'deco');
            else if (r < 0.198) add('pillar_0', true, 6, 'ruin');
            break;
          case BIOME.SWAMP:
            if (r < 0.07) add('cattail_0', false, 0, 'deco');
            else if (r < 0.09) add(pick(rnd, ['mush_brown', 'mush_blue']), false, 0, 'mushroom');
            else if (r < 0.14) add(pick(rnd, ['tuft_0', 'tuft_2']), false, 0, 'deco');
            break;
          case BIOME.DESERT:
            if (r < 0.035) add('cactus_0', true, 5, 'cactus');
            else if (r < 0.06) add(pick(rnd, ['rock_s_0', 'rock_s_2']), false, 0, 'stone');
            else if (r < 0.068) add('rock_b_1', true, 6, 'stone');
            else if (r < 0.075) add('pillar_1', true, 6, 'ruin');
            break;
          case BIOME.ROCK:
            if (r < 0.13) add(pick(rnd, ['rock_b_0', 'rock_b_1', 'rock_b_2']), true, 6, 'stone');
            else if (r < 0.175) add(pick(rnd, ['rock_s_0', 'rock_s_1']), false, 0, 'stone');
            else if (r < 0.195) add(pick(rnd, ['ore_iron', 'ore_coal']), true, 6, 'ore');
            else if (r < 0.202) add(pick(rnd, ['ore_gold', 'ore_crystal']), true, 6, 'ore');
            break;
          case BIOME.SNOW:
            if (r < 0.03) add('rock_snow_0', true, 6, 'stone');
            else if (r < 0.06) add('bush_snow', false, 0, 'bush');
            break;
          case BIOME.ASH:
            if (r < 0.05) add('rock_ash_0', true, 6, 'stone');
            else if (r < 0.07) add('ore_crystal', true, 6, 'ore');
            break;
          case BIOME.BEACH:
            if (r < 0.02) add(pick(rnd, ['rock_s_0', 'rock_s_1']), false, 0, 'stone');
            break;
        }
        // ---- capa de decoración
        // El switch de arriba es una cadena if/else sobre un solo `r`, asi que
        // un tile que sacaba árbol NO podia tener ademas pasto a los pies: por
        // eso el suelo se veia pelado justo alrededor de los árboles. Este pase
        // tiene su propio sorteo y corre siempre.
        const deco = DECO[b];
        if (deco) {
          // densidad en manchones: la naturaleza se agrupa, y la distribución
          // uniforme se lee como ruido
          const cl = this.dN.fbm(wx * 0.055, wy * 0.055, 2);
          // en los claros sube la decoración: un claro vacío es un agujero, un
          // claro con pasto alto y flores es un lugar
          const glade = Math.max(0.55, 1.9 - gv);
          if (rnd() < Math.max(0, 0.07 + cl * 0.45) * glade * this.densMul) {
            props.push({ x: wx * 16 + 2 + rnd() * 12, y: wy * 16 + 2 + rnd() * 12,
              s: pick(rnd, deco), solid: false, r: 0, type: 'deco' });
          }
        }

        // creature spawn points
        if (!info.water && rnd() < 0.0075) {
          const table = {
            [BIOME.FOREST]: ['rabbit', 'deer', 'bird', 'wolf'],
            [BIOME.GRASS]: ['rabbit', 'deer', 'bird'],
            [BIOME.MEADOW]: ['rabbit', 'bird', 'bird'],
            [BIOME.SWAMP]: ['slime', 'slime', 'bird'],
            [BIOME.DESERT]: ['slime'],
            [BIOME.ROCK]: ['wolf', 'bird'],
            [BIOME.SNOW]: ['wolf', 'rabbit'],
            [BIOME.ASH]: ['slime', 'wolf'],
            [BIOME.BEACH]: ['bird'],
          }[b];
          if (table) spawns.push({ x: px, y: py, kind: pick(rnd, table) });
        }
      }
    }

    // landmarks: one per chunk at most, deterministic
    const lr = mulberry32((cx * 374761393) ^ (cy * 668265263) ^ (this.seed + 99))();
    if (lr < 0.16) {
      const tx = cx * CH + 4 + ((lr * 1000) % (CH - 8) | 0);
      const ty = cy * CH + 4 + ((lr * 7919) % (CH - 8) | 0);
      if (!this.isWater(tx, ty)) {
        const kind = lr < 0.055 ? 'shrine' : (lr < 0.105 ? 'chest' : 'camp');
        const px = tx * 16 + 8, py = ty * 16 + 8;
        if (kind === 'shrine') {
          props.push({ x: px, y: py, s: 'shrine_0', solid: true, r: 9, type: 'shrine', id: `s${cx},${cy}` });
          for (let i = 0; i < 4; i++) {
            const a = i / 4 * Math.PI * 2 + 0.4;
            props.push({ x: px + Math.cos(a) * 34, y: py + Math.sin(a) * 30, s: 'pillar_' + (i % 2), solid: true, r: 6, type: 'ruin' });
          }
        } else if (kind === 'chest') {
          props.push({ x: px, y: py, s: 'chest_0', solid: false, r: 0, type: 'chest', id: `c${cx},${cy}` });
          props.push({ x: px - 24, y: py + 6, s: 'pillar_1', solid: true, r: 6, type: 'ruin' });
          props.push({ x: px + 26, y: py - 4, s: 'pillar_0', solid: true, r: 6, type: 'ruin' });
        } else {
          props.push({ x: px, y: py, s: 'campfire_0', solid: false, r: 0, type: 'campfire', anim: 4, id: `f${cx},${cy}` });
          props.push({ x: px - 20, y: py + 10, s: 'stump_0', solid: true, r: 5, type: 'wood' });
          props.push({ x: px + 22, y: py + 4, s: 'rock_b_2', solid: true, r: 6, type: 'stone' });
        }
      }
    }

    // stable id per prop so saves can mark exactly which ones are gone
    for (const p of props) {
      if (!p.id) p.id = `${Math.round(p.x)}:${Math.round(p.y)}:${p.s}`;
      if (this.consumed.has(p.id)) {
        if (p.type === 'chest') p.opened = true; else p.taken = true;
      }
    }
    // re-attach anything the player placed inside this chunk
    for (const q of this.placed) {
      const qcx = Math.floor(q.x / (CH * TS_PX));
      const qcy = Math.floor(q.y / (CH * TS_PX));
      if (qcx === cx && qcy === cy) props.push(q);
    }
    props.sort((a, b) => a.y - b.y);
    return { cx, cy, props, spawns };
  }
}

function pick(rnd, arr) { return arr[(rnd() * arr.length) | 0]; }

const TS = 16;
class Atlas {
  constructor(img, index) { this.img = img; this.idx = index; }
  has(n) { return !!this.idx[n]; }
  draw(ctx, name, x, y, alpha) {
    const f = this.idx[name];
    if (!f) return;
    if (alpha !== undefined) { ctx.globalAlpha = alpha; }
    ctx.drawImage(this.img, f[0], f[1], f[2], f[3], x | 0, y | 0, f[2], f[3]);
    if (alpha !== undefined) ctx.globalAlpha = 1;
  }
  size(name) { const f = this.idx[name]; return f ? [f[2], f[3]] : [0, 0]; }
}

const DIRS8 = [
  ['n', 0, -1], ['e', 1, 0], ['s', 0, 1], ['w', -1, 0],
  ['ne', 1, -1], ['se', 1, 1], ['sw', -1, 1], ['nw', -1, -1],
];

/** Renders (and caches) ground for one chunk into an offscreen canvas. */
class GroundCache {
  constructor(world, atlas) {
    this.w = world; this.a = atlas;
    this.cache = new Map();
    this.waterFrame = 0;
  }
  invalidate(cx, cy) {
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      this.cache.delete((cx + dx) + ',' + (cy + dy));
  }
  invalidateAll() { this.cache.clear(); }
  clearWater() { for (const [k, v] of this.cache) if (v.hasWater) this.cache.delete(k); }

  get(cx, cy, wframe, fframe) {
    const key = cx + ',' + cy;
    const sig = wframe * 8 + fframe;
    let e = this.cache.get(key);
    if (e && e.wframe === sig) return e.canvas;
    if (e && !e.hasWater) return e.canvas;
    const canvas = e ? e.canvas : document.createElement('canvas');
    if (!e) { canvas.width = CH * TS; canvas.height = CH * TS; }
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const hasWater = this.paint(ctx, cx, cy, wframe, fframe);
    this.cache.set(key, { canvas, wframe: sig, hasWater });
    if (this.cache.size > 60) {

        ctx.fillRect(bx * B, by * B, B, B);

            ctx.restore();
          } else {
            A.draw(ctx, wn, px, py);
          }
        } else {
          const h = hash2(wx, wy);
          const v = h % 4;
          // mirror/flip variants: 4 tiles -> 16 apparent permutations
          const fx = (h >> 3) & 1, fy = (h >> 4) & 1;
          if (fx || fy) {
            ctx.save();
            ctx.translate(px + (fx ? TS : 0), py + (fy ? TS : 0));
            ctx.scale(fx ? -1 : 1, fy ? -1 : 1);
            A.draw(ctx, `tile_${base}_${v}`, 0, 0);
            ctx.restore();
          } else {

        const overlays = [];
        for (const [dir, dx, dy] of DIRS8) {
          const n = tn(wx + dx, wy + dy);
          if (n === base) continue;
          const np = TILE_PRIO[n] ?? 0, bp = TILE_PRIO[base] ?? 0;
          if (np <= bp) continue;
          if (n === 'water' || n === 'deep') continue; // water never bleeds onto land
          overlays.push([np, `edge_${n}_${dir}`]);

        overlays.sort((a, b) => a[0] - b[0]);
        for (const [, nm] of overlays) A.draw(ctx, nm, px, py);

        // foam on land tiles adjacent to water (animated surge)
        if (!isW) {
          for (const [dir, dx, dy] of DIRS8) {

          }
          A.draw(ctx, `cliff_top_${hash2(wx, wy) % 3}`, px, py);
          ctx.fillStyle = 'rgba(12,20,16,.38)';
          ctx.fillRect(px, py + TS + drop * TS, TS, 5);

/** Elipses de sombra pre-rasterizadas, cacheadas por tamaño.
 *  `ctx.ellipse()` sale con antialias, y en un juego donde la fuente se
 *  recolorea con source-in para no verse borrosa eso desentona. Las dibujamos
 *  una vez y umbralamos el alfa: borde duro, mismo escalón que todo lo demás. */

  constructor(color) { this.cache = new Map(); this.c = color || 'rgb(17,29,21)'; }
  get(w, h) {
    const key = w + ',' + h;

    if (cv) return cv;
    cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');
    g.fillStyle = this.c;
    g.beginPath();
    g.ellipse(w / 2, h / 2, w / 2, h / 2, 0, 0, 7);
    g.fill();

    for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 110 ? 255 : 0;
    g.putImageData(d, 0, 0);

    this.cache.set(key, cv);

}

/** Simple lightmap: day/night tint + radial lights, composited with 'multiply'. */
class Lighting {
  constructor() {
    this.c = document.createElement('canvas');
    this.ctx = this.c.getContext('2d');
    this.scale = 4; // low-res lightmap for speed & soft falloff
  }
  resize(w, h) {
    const nw = Math.ceil(w / this.scale), nh = Math.ceil(h / this.scale);
    if (this.c.width !== nw || this.c.height !== nh) { this.c.width = nw; this.c.height = nh; }
  }
  render(ambient, lights, camX, camY, zoom) {
    const ctx = this.ctx, s = this.scale;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = ambient;
    ctx.fillRect(0, 0, this.c.width, this.c.height);
    ctx.globalCompositeOperation = 'lighter';
    for (const L of lights) {
      const x = (L.x - camX) * zoom / s, y = (L.y - camY) * zoom / s;
      const r = L.r * zoom / s;
      if (x < -r || y < -r || x > this.c.width + r || y > this.c.height + r) continue;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const c = L.c || [255, 190, 110];
      g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${L.i})`);
      g.addColorStop(0.55, `rgba(${c[0]},${c[1]},${c[2]},${L.i * 0.42})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    return this.c;
  }
}

// Canvas-drawn UI: bitmap font + 9-slice panels. No DOM, no system fonts.
class BitmapFont {
  constructor(atlas, meta) {
    this.a = atlas;
    this.g = meta.glyphs;
    this.fw = meta.w;
    this.fh = meta.h;
    this.frame = atlas.idx['ui_font'];
    this.tinted = new Map();      // colour -> pre-tinted font canvas
  }

  /** Recolour the whole glyph strip once per colour (cheap + crisp). */
  sheet(color) {
    let c = this.tinted.get(color);
    if (c) return c;
    const f = this.frame;
    const cv = document.createElement('canvas');
    cv.width = f[2]; cv.height = f[3];
    const g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(this.a.img, f[0], f[1], f[2], f[3], 0, 0, f[2], f[3]);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(0, 0, f[2], f[3]);
    this.tinted.set(color, cv);
    return cv;
  }

  width(text, s = 1, tracking = 1) {
    let w = 0;
    for (const ch of text) {
      const m = this.g[ch] || this.g[' '];
      w += (m[2] + tracking) * s;
    }
    return w - tracking * s;
  }
  // metrics are [sheetX, sheetY, advance]

  draw(ctx, text, x, y, s = 1, color = '#f2e2b4', tracking = 1) {
    const sheet = this.sheet(color);
    let cx = Math.round(x);
    for (const ch of text) {
      const m = this.g[ch] || this.g[' '];
      if (ch !== ' ') {
        ctx.drawImage(sheet, m[0], m[1], this.fw, this.fh,
          cx, Math.round(y), this.fw * s, this.fh * s);
      }
      cx += (m[2] + tracking) * s;
    }
    return cx;
  }

  /** Text with a hard pixel drop-shadow (offset by whole pixels). */
  drawShadow(ctx, text, x, y, s = 1, color = '#f2e2b4',
             shadow = 'rgba(0,0,0,.75)', off = 1, tracking = 1) {
    this.draw(ctx, text, x + off * s, y + off * s, s, shadow, tracking);
    return this.draw(ctx, text, x, y, s, color, tracking);
  }

  center(ctx, text, cx, y, s = 1, color, shadow, tracking = 1) {
    const w = this.width(text, s, tracking);
    if (shadow) return this.drawShadow(ctx, text, cx - w / 2, y, s, color, shadow, 1, tracking);
    return this.draw(ctx, text, cx - w / 2, y, s, color, tracking);
  }
}

/** 9-slice: stretch a bordered source sprite to any size, keeping corners crisp. */
function nineSlice(ctx, atlas, name, x, y, w, h, border = 3, s = 1) {
  const f = atlas.idx[name];
  if (!f) return;
  const [sx, sy, sw, sh] = f;
  const b = border, bs = border * s;
  x = Math.round(x); y = Math.round(y);
  w = Math.round(w); h = Math.round(h);
  const img = atlas.img;
  const midW = Math.max(1, w - bs * 2), midH = Math.max(1, h - bs * 2);
  const ssw = sw - b * 2, ssh = sh - b * 2;
  // corners
  ctx.drawImage(img, sx, sy, b, b, x, y, bs, bs);
  ctx.drawImage(img, sx + sw - b, sy, b, b, x + w - bs, y, bs, bs);
  ctx.drawImage(img, sx, sy + sh - b, b, b, x, y + h - bs, bs, bs);
  ctx.drawImage(img, sx + sw - b, sy + sh - b, b, b, x + w - bs, y + h - bs, bs, bs);
  // edges
  ctx.drawImage(img, sx + b, sy, ssw, b, x + bs, y, midW, bs);
  ctx.drawImage(img, sx + b, sy + sh - b, ssw, b, x + bs, y + h - bs, midW, bs);
  ctx.drawImage(img, sx, sy + b, b, ssh, x, y + bs, bs, midH);
  ctx.drawImage(img, sx + sw - b, sy + b, b, ssh, x + w - bs, y + bs, bs, midH);
  // centre
  ctx.drawImage(img, sx + b, sy + b, ssw, ssh, x + bs, y + bs, midW, midH);
}

/** Clickable button rendered from the wooden button sprite. */
class Button {
  constructor(label, x, y, w, h, onClick, opts = {}) {
    Object.assign(this, { label, x, y, w, h, onClick });
    this.hover = false; this.press = false;
    this.scale = opts.scale || 2;
    this.icon = opts.icon || null;
    this.sub = opts.sub || null;
  }
  hit(mx, my) {
    return mx >= this.x && mx <= this.x + this.w &&
           my >= this.y && my <= this.y + this.h;
  }
  draw(ctx, atlas, font, t) {
    const st = this.press ? 'press' : (this.hover ? 'hover' : 'idle');
    const yoff = this.press ? 2 : 0;
    // drop shadow under the button
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(this.x + 3, this.y + 4, this.w, this.h);
    nineSlice(ctx, atlas, `ui_btn_${st}`, this.x, this.y + yoff, this.w, this.h, 3, 1);
    const s = this.scale;
    const col = this.hover ? '#fff4d2' : '#e8d9ae';
    const cy = this.y + yoff + (this.h - font.fh * s) / 2 - (this.sub ? 6 : 0);
    let tx = this.x + this.w / 2;
    if (this.icon) tx += 8;
    font.center(ctx, this.label, tx, cy, s, col, 'rgba(0,0,0,.7)');
    if (this.sub) {
      font.center(ctx, this.sub, tx, cy + font.fh * s + 5, 2, '#b3a382', 'rgba(0,0,0,.7)', 2);
    }
    if (this.hover) {
      // gold selection arrows either side
      const bob = Math.round(Math.sin(t / 160) * 1.5);
      font.draw(ctx, '>', this.x - 12 - bob, cy, s, '#f0c85a', 1);
      font.draw(ctx, '<', this.x + this.w + 5 + bob, cy, s, '#f0c85a', 1);
    }
  }
}

/** Build a recoloured copy of every player frame for the chosen look. */
function buildPlayerSheet(atlas, pal, look) {
  const names = [];

    for (const d of ['s', 'w', 'n', 'e']) {
      const n = act === 'idle' ? 1 : 4;
      for (let i = 0; i < n; i++) names.push(`player${look.hair}_${act}_${d}_${i}`);
    }
  }
  // map source colour -> replacement
  const swap = new Map();
  const add = (fromArr, toArr) => {
    for (let i = 0; i < fromArr.length; i++) {
      const f = HEX(fromArr[i]), t = HEX(toArr[i]);
      swap.set((f[0] << 16) | (f[1] << 8) | f[2], t);
    }
  };
  add(pal.skin, SKIN_TONES[look.skin].r);
  add(pal.hair, HAIR_COLORS[look.hairCol].r);
  add(pal.cloak, CLOAK_COLORS[look.cloak].r);
  add(pal.tunic, TUNIC_COLORS[look.tunic].r);
  add(pal.pants, PANTS_COLORS[look.pants].r);

  // pack frames into one sheet
  let W = 0, Hm = 0;
  const src = [];
  for (const n of names) {
    const f = atlas.idx[n];
    if (!f) continue;
    src.push([n, f]);
    W += f[2]; Hm = Math.max(Hm, f[3]);

  const cv = document.createElement('canvas');
  cv.width = Math.max(1, W); cv.height = Math.max(1, Hm);
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  const index = {};
  let x = 0;
  for (const [n, f] of src) {
    g.drawImage(atlas.img, f[0], f[1], f[2], f[3], x, 0, f[2], f[3]);
    index[n] = [x, 0, f[2], f[3]];
    x += f[2];
  }
  // recolour in place
  const id = g.getImageData(0, 0, cv.width, cv.height);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] === 0) continue;
    const key = (d[i] << 16) | (d[i + 1] << 8) | d[i + 2];
    const t = swap.get(key);
    if (t) { d[i] = t[0]; d[i + 1] = t[1]; d[i + 2] = t[2]; }
  }
  g.putImageData(id, 0, 0);
  return { canvas: cv, index };
}

const XP_PER_LEVEL = 100;
class Progress {
  constructor() {
    this.xp = 0;
    this.level = 1;
    this.counters = {
      distance: 0, gathered: 0, biomes: 0, shrines: 0,
      chests: 0, nights: 0, relics: 0,
    };
    this.done = new Set();
    this.active = [];
    this.pending = [];      // toasts to show
    this.refresh();
  }

  refresh() {
    // keep up to 3 active objectives, in definition order
    this.active = QUEST_DEFS
      .filter(q => !this.done.has(q.id))
      .slice(0, 3);
  }

  bump(track, amount = 1) {
    if (!(track in this.counters)) return;
    this.counters[track] += amount;
    this.check();
  }
  set(track, value) {
    if (!(track in this.counters)) return;
    if (value > this.counters[track]) { this.counters[track] = value; this.check(); }
  }

  check() {
    for (const q of this.active.slice()) {
      if (this.counters[q.track] >= q.goal && !this.done.has(q.id)) {
        this.done.add(q.id);
        this.addXP(q.xp);
        this.pending.push({ type: 'quest', title: q.n, sub: `+${q.xp} EXP` });
      }
    }
    this.refresh();
  }

  addXP(n) {
    this.xp += n;
    while (this.xp >= this.level * XP_PER_LEVEL) {
      this.xp -= this.level * XP_PER_LEVEL;
      this.level++;
      this.pending.push({ type: 'level', title: `NIVEL ${this.level}`, sub: 'vigor +10' });
    }
  }

  get need() { return this.level * XP_PER_LEVEL; }
  get frac() { return Math.max(0, Math.min(1, this.xp / this.need)); }

  progressOf(q) {
    return Math.min(1, this.counters[q.track] / q.goal);
  }
  textOf(q) {
    const c = Math.min(this.counters[q.track], q.goal);
    return `${Math.floor(c)}/${q.goal}`;
  }
}

// Procedural audio: every sound is synthesised with WebAudio at runtime.
// No sample files, so the single-file build stays self-contained.
class Audio {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.enabled = true;
    this.musicOn = true;
    this.started = false;
    this.noiseBuf = null;
    this._musicTimer = 0;
    this._step = 0;
    this._ambTimer = 0;
  }

  /** Must be called from a user gesture (browsers block autoplay). */
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.enabled = false; return; }
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.55;
    this.master.connect(this.ctx.destination);

    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.34;
    this.musicGain.connect(this.master);

    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.85;
    this.sfxGain.connect(this.master);

    // shared white-noise buffer for wind, steps, water
    const len = this.ctx.sampleRate * 2;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    this.startAmbience();
    this.started = true;
  }

  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }

  get t() { return this.ctx ? this.ctx.currentTime : 0; }

  // ------------------------------------------------------------ helpers
  _env(g, t0, a, d, peak = 1) {
    g.gain.cancelScheduledValues(t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
  }

  tone(freq, { type = 'sine', dur = 0.2, atk = 0.008, vol = 0.3,
               slide = 0, dest = null, detune = 0 } = {}) {
    if (!this.ctx || !this.enabled) return;
    const t0 = this.t;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t0 + dur);
    if (detune) o.detune.value = detune;
    this._env(g, t0, atk, dur, vol);
    o.connect(g); g.connect(dest || this.sfxGain);
    o.start(t0); o.stop(t0 + dur + atk + 0.05);
  }

  noise({ dur = 0.15, vol = 0.25, type = 'bandpass', freq = 900, q = 1,
          sweep = 0 } = {}) {
    if (!this.ctx || !this.enabled) return;
    const t0 = this.t;
    const s = this.ctx.createBufferSource();
    s.buffer = this.noiseBuf;
    s.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = type; f.frequency.setValueAtTime(freq, t0); f.Q.value = q;
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(60, freq + sweep), t0 + dur);
    const g = this.ctx.createGain();
    this._env(g, t0, 0.005, dur, vol);
    s.connect(f); f.connect(g); g.connect(this.sfxGain);
    s.start(t0); s.stop(t0 + dur + 0.08);
  }

  // ------------------------------------------------------------- ambience
  startAmbience() {
    // continuous low wind bed
    const s = this.ctx.createBufferSource();
    s.buffer = this.noiseBuf; s.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = 0.6;
    const g = this.ctx.createGain();
    g.gain.value = 0.055;
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start();
    this.windGain = g;
    this.windFilter = f;

    // slow LFO so the wind breathes
    const lfo = this.ctx.createOscillator();
    const lg = this.ctx.createGain();
    lfo.frequency.value = 0.07; lg.gain.value = 0.03;
    lfo.connect(lg); lg.connect(g.gain);
    lfo.start();
  }

  /** Wind intensity follows biome + weather. */
  setAmbience(kind, night) {
    if (!this.windGain) return;
    const t0 = this.t;
    const map = { rock: [700, .10], snow: [520, .12], ash: [380, .09],
                  desert: [640, .08], forest: [300, .05], swamp: [260, .05],
                  water: [340, .07], default: [420, .055] };
    const [fq, vol] = map[kind] || map.default;
    this.windFilter.frequency.linearRampToValueAtTime(fq, t0 + 1.2);
    this.windGain.gain.linearRampToValueAtTime(night ? vol * 1.4 : vol, t0 + 1.2);
  }

  /** Occasional one-shot nature sounds. */
  tickAmbience(dt, biome, night) {
    if (!this.ctx || !this.enabled) return;
    this._ambTimer -= dt;
    if (this._ambTimer > 0) return;
    this._ambTimer = 5 + Math.random() * 11;
    const r = Math.random();
    if (night) {
      if (r < 0.4) {                                   // owl
        this.tone(420, { type: 'sine', dur: 0.20, vol: 0.09, slide: -80 });
        setTimeout(() => this.tone(360, { type: 'sine', dur: 0.28, vol: 0.08, slide: -60 }), 260);
      } else if (r < 0.6) {                            // distant howl
        this.tone(300, { type: 'sawtooth', dur: 1.1, vol: 0.05, slide: 90 });
      } else if (r < 0.8) {                            // crickets
        for (let i = 0; i < 5; i++)
          setTimeout(() => this.noise({ dur: 0.03, vol: 0.05, freq: 5200, q: 22 }), i * 130);
      }
    } else {
      if (r < 0.55) {                                  // birdsong
        const base = 1500 + Math.random() * 900;
        const n = 2 + (Math.random() * 3 | 0);
        for (let i = 0; i < n; i++) {
          setTimeout(() => this.tone(base * (1 + i * 0.12), {
            type: 'sine', dur: 0.09, vol: 0.07, slide: 260,
          }), i * 110);
        }
      } else if (r < 0.75) {                           // rustle
        this.noise({ dur: 0.4, vol: 0.05, freq: 1800, q: 0.8, sweep: -900 });
      }
    }
  }

  // ---------------------------------------------------------------- SFX
  step(surface) {
    if (!this.ctx || !this.enabled) return;
    this._step = (this._step + 1) % 2;
    const v = this._step ? 1 : 0.82;
    const s = {
      grass:  { freq: 2100, q: 1.2, dur: 0.075, vol: 0.085 },
      sand:   { freq: 1500, q: 0.8, dur: 0.09,  vol: 0.075 },
      rock:   { freq: 3200, q: 2.5, dur: 0.055, vol: 0.095 },
      snow:   { freq: 1100, q: 1.6, dur: 0.10,  vol: 0.075 },
      water:  { freq: 900,  q: 0.7, dur: 0.16,  vol: 0.11  },
      wood:   { freq: 800,  q: 3.0, dur: 0.07,  vol: 0.09  },
    }[surface] || { freq: 2000, q: 1.2, dur: 0.08, vol: 0.08 };
    this.noise({ dur: s.dur, vol: s.vol * v, freq: s.freq, q: s.q, sweep: -s.freq * 0.45 });
  }

  pickup(kind) {
    const base = { berry: 720, mushroom: 620, wood: 380, stone: 300,
                   flower: 820, ore: 460, crystal: 1000 }[kind] || 640;
    this.tone(base, { type: 'triangle', dur: 0.09, vol: 0.16 });
    setTimeout(() => this.tone(base * 1.5, { type: 'triangle', dur: 0.11, vol: 0.12 }), 70);
  }

  chop()  { this.noise({ dur: 0.12, vol: 0.2, freq: 420, q: 1.4, sweep: -200 });
            this.tone(150, { type: 'square', dur: 0.09, vol: 0.1, slide: -60 }); }
  mine()  { this.noise({ dur: 0.10, vol: 0.22, freq: 2600, q: 3.5, sweep: -1800 });
            this.tone(240, { type: 'square', dur: 0.07, vol: 0.09, slide: -90 }); }

  chest() {
    this.noise({ dur: 0.2, vol: 0.14, freq: 700, q: 1.2, sweep: 500 });
    const notes = [523, 659, 784, 1047];
    notes.forEach((n, i) => setTimeout(() =>
      this.tone(n, { type: 'triangle', dur: 0.22, vol: 0.15 }), i * 85));
  }

  shrine() {
    const notes = [392, 523, 659, 784, 1047];
    notes.forEach((n, i) => setTimeout(() => {
      this.tone(n, { type: 'sine', dur: 0.9, vol: 0.13 });
      this.tone(n * 2, { type: 'sine', dur: 0.7, vol: 0.05 });
    }, i * 120));
  }

  quest() {
    const notes = [659, 784, 988];
    notes.forEach((n, i) => setTimeout(() =>
      this.tone(n, { type: 'triangle', dur: 0.3, vol: 0.16 }), i * 100));
  }

  levelUp() {
    const notes = [523, 659, 784, 1047, 1319];
    notes.forEach((n, i) => setTimeout(() => {
      this.tone(n, { type: 'triangle', dur: 0.35, vol: 0.17 });
      this.tone(n * 1.5, { type: 'sine', dur: 0.3, vol: 0.07 });
    }, i * 90));
  }

  discover() {
    [440, 587, 740].forEach((n, i) => setTimeout(() =>
      this.tone(n, { type: 'sine', dur: 0.5, vol: 0.12 }), i * 130));
  }

  hurt() {
    this.tone(220, { type: 'sawtooth', dur: 0.18, vol: 0.2, slide: -120 });
    this.noise({ dur: 0.12, vol: 0.14, freq: 700, q: 1, sweep: -400 });
  }

  growl() {
    this.tone(90, { type: 'sawtooth', dur: 0.5, vol: 0.11, slide: 30 });
    this.noise({ dur: 0.5, vol: 0.06, freq: 300, q: 2, sweep: -120 });
  }

  heal() {
    [523, 659, 784].forEach((n, i) => setTimeout(() =>
      this.tone(n, { type: 'sine', dur: 0.4, vol: 0.11 }), i * 110));
  }

  ui(kind) {
    if (kind === 'move') this.tone(660, { type: 'square', dur: 0.03, vol: 0.05 });
    else if (kind === 'select') { this.tone(880, { type: 'square', dur: 0.05, vol: 0.08 });
      setTimeout(() => this.tone(1320, { type: 'square', dur: 0.06, vol: 0.06 }), 40); }
    else if (kind === 'back') this.tone(400, { type: 'square', dur: 0.06, vol: 0.06, slide: -120 });
    else if (kind === 'tick') this.tone(1200, { type: 'square', dur: 0.02, vol: 0.04 });
  }

  // -------------------------------------------------------------- music
  /** Sparse generative score: a slow pad plus a wandering pentatonic melody. */
  tickMusic(dt, night, danger) {
    if (!this.ctx || !this.enabled || !this.musicOn) return;
    this._musicTimer -= dt;
    if (this._musicTimer > 0) return;
    this._musicTimer = danger ? 1.6 : (night ? 5.0 : 3.6);

    const SCALE_DAY = [0, 2, 4, 7, 9];            // major pentatonic
    const SCALE_NIGHT = [0, 3, 5, 7, 10];         // minor pentatonic
    const scale = night || danger ? SCALE_NIGHT : SCALE_DAY;
    const root = danger ? 146.83 : (night ? 174.61 : 196.00);

    // pad chord
    const t0 = this.t;
    for (const semi of [0, scale[2], scale[4]]) {
      const f = root * Math.pow(2, semi / 12);
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      const lp = this.ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = danger ? 700 : 1200;
      o.type = 'triangle'; o.frequency.value = f;
      o.detune.value = (Math.random() - 0.5) * 12;
      const dur = danger ? 1.5 : 3.4;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.06, t0 + 0.8);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(lp); lp.connect(g); g.connect(this.musicGain);
      o.start(t0); o.stop(t0 + dur + 0.1);
    }

    // melody note, sometimes
    if (Math.random() < (danger ? 0.35 : 0.62)) {
      const semi = scale[(Math.random() * scale.length) | 0];
      const oct = Math.random() < 0.35 ? 4 : 2;
      const f = root * oct * Math.pow(2, semi / 12);
      setTimeout(() => {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const tt = this.t;
        g.gain.setValueAtTime(0.0001, tt);
        g.gain.exponentialRampToValueAtTime(0.075, tt + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, tt + 1.5);
        o.connect(g); g.connect(this.musicGain);
        o.start(tt); o.stop(tt + 1.6);
      }, 400 + Math.random() * 900);
    }
  }

  setMusic(on) {
    this.musicOn = on;
    if (this.musicGain)
      this.musicGain.gain.linearRampToValueAtTime(on ? 0.34 : 0.0001, this.t + 0.4);
  }
  setEnabled(on) {
    this.enabled = on;
    if (this.master)
      this.master.gain.linearRampToValueAtTime(on ? 0.55 : 0.0001, this.t + 0.3);
  }
}
