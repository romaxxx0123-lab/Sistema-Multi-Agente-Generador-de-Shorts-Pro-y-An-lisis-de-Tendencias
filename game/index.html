<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vagabundo de Ellswyr — explorador pixel art</title>
<style>
  :root{
    --ink:#0c0e14; --panel:rgba(16,18,26,.82); --gold:#d8b45c; --parch:#e8dcc0;
    --edge:#6b5a3a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0c12}
  body{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color:var(--parch); -webkit-font-smoothing:none;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  canvas#game{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  .hidden{display:none!important}

  #loading{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;z-index:40;
    background:#0a0c12;
  }
  #loading .bar{width:200px;height:8px;background:#1b2030;border:2px solid #414b63;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:40%;background:#d8b45c;
    animation:sl 1.1s infinite ease-in-out}
  @keyframes sl{0%{margin-left:-40%}100%{margin-left:100%}}
  #loading .lt{color:#8b93a8;font-size:11px;letter-spacing:.3em;text-transform:uppercase}

  /* ---------- touch ---------- */
  #touch{position:fixed;inset:0;z-index:25;pointer-events:none}
  #stick{
    position:absolute;left:22px;bottom:22px;width:104px;height:104px;
    border-radius:50%;background:rgba(20,24,34,.42);border:2px solid rgba(107,90,58,.7);
    pointer-events:auto;
  }
  #nub{
    position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;
    border-radius:50%;background:rgba(216,180,92,.42);border:2px solid rgba(216,180,92,.8);
  }
  .tbtn{
    position:absolute;right:22px;width:70px;height:70px;border-radius:50%;
    background:rgba(20,24,34,.5);border:2px solid rgba(107,90,58,.8);
    color:#f0e6cc;font:inherit;font-size:12px;pointer-events:auto;
  }
  #btnAct{bottom:34px}
  #btnMap{bottom:118px;width:56px;height:56px;right:29px;font-size:11px}
  @media (hover:hover) and (pointer:fine){ #touch{display:none} }
  @media (max-width:720px){ #keys{display:none} #inv .it{font-size:11px;padding:4px 8px} }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="loading">
  <div class="bar"><i></i></div>
  <div class="lt">forjando el mundo</div>
</div>

<div id="touch">
  <div id="stick"><div id="nub"></div></div>
  <button class="tbtn" id="btnAct">E</button>
  <button class="tbtn" id="btnMap">MAP</button>
</div>

<div id="pause" class="hidden">
  <h3>PAUSA</h3>
  <button class="mb" id="btnResume">Continuar</button>
  <button class="mb" id="btnQuit">Volver al título</button>
</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
